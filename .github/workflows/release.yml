name: Build & Release Multiplatform

on:
  push:
    tags:
      - 'v*'
      - '!v*-demo'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Game Tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SAMURAI_EDGE_LANG: pt
        run: |
          python tests/test_game.py
          python tests/test_arcade_mode.py
          python tests/test_boss_oni.py
          python tests/test_cycle6_full_integration.py
          python tests/test_cycle6_combat.py
          python tests/test_cycle6_arenas.py
          python tests/test_demo_edition.py
          python tests/test_translation_and_ui.py
          python tests/test_language_setting.py
          python tests/test_parchment_screens.py
          python tests/test_opening_video.py
          python tests/test_seimei_rondel.py
          python tests/test_audio_system.py
          python tests/test_controllers_and_touch.py

  build:
    name: Build (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            artifact_name: Samurai-Edge-Demake-macOS.zip
          - os: ubuntu-latest
            platform: linux
            artifact_name: Samurai-Edge-Demake-Linux.tar.gz
          - os: windows-latest
            platform: windows
            artifact_name: Samurai-Edge-Demake-Windows.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --clean -y samurai_edge.spec

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --clean -y samurai_edge.spec

      - name: Package Release (macOS)
        if: runner.os == 'macOS'
        run: |
          xattr -cr dist/SamuraiEdge.app || true
          codesign -s - --force --deep dist/SamuraiEdge.app || true
          ditto -c -k --keepParent dist/SamuraiEdge.app ${{ matrix.artifact_name }}

      - name: Package Release (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czvf ${{ matrix.artifact_name }} -C dist SamuraiEdge

      - name: Package Release (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist\SamuraiEdge -DestinationPath ${{ matrix.artifact_name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  build-android:
    name: Build (Android APK)
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build with Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: stable

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        if: steps.buildozer.outputs.filename != ''
        with:
          name: android-build
          path: ${{ steps.buildozer.outputs.filename }}

  publish:
    name: Publish GitHub Release
    needs: [build, build-android]
    if: always() && needs.test.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Tag Name
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: List Artifacts
        run: |
          ls -la release_assets/

      - name: Setup Butler
        if: env.BUTLER_API_KEY != ''
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        uses: remarkablegames/setup-butler@v1

      - name: Deploy to itch.io via Butler
        if: env.BUTLER_API_KEY != ''
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          TARGET="colletes/samurai-edge-bakumatsu"
          
          if [ -f "release_assets/Samurai-Edge-Demake-Windows.zip" ]; then
            echo "Pushing Windows build to itch.io ($TARGET:windows)..."
            butler push release_assets/Samurai-Edge-Demake-Windows.zip "$TARGET:windows" --userversion "$TAG"
          fi
          
          # Only push macOS if explicitly requested in workflow_dispatch to avoid overwriting local signed releases
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -f "release_assets/Samurai-Edge-Demake-macOS.zip" ]; then
            echo "Pushing macOS build to itch.io ($TARGET:osx)..."
            butler push release_assets/Samurai-Edge-Demake-macOS.zip "$TARGET:osx" --userversion "$TAG"
          fi
          
          if [ -f "release_assets/Samurai-Edge-Demake-Linux.tar.gz" ]; then
            echo "Pushing Linux build to itch.io ($TARGET:linux)..."
            butler push release_assets/Samurai-Edge-Demake-Linux.tar.gz "$TARGET:linux" --userversion "$TAG"
          fi
          
          APK_FILE=$(find release_assets -name "*.apk" 2>/dev/null | head -n 1 || true)
          if [ -n "$APK_FILE" ]; then
            echo "Pushing Android build to itch.io ($TARGET:android)..."
            butler push "$APK_FILE" "$TARGET:android" --userversion "$TAG"
          fi

      - name: Create GitHub Release (Notes & Changelog only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Samurai Edge Demake ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🎮 Playable Builds & Downloads
            Official game builds for macOS, Windows, Linux, and Android are distributed **exclusively on itch.io**:
            👉 **[Download Samurai Edge Demake on itch.io](https://colletes.itch.io/samurai-edge-bakumatsu)**

