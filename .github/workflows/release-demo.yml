name: Build & Release Demo

# Tag v1.5.0-demo (ou qualquer v*-demo): empacota a edição demo e envia só aos canais *-demo do itch.io via Butler
on:
  push:
    tags:
      - 'v*-demo'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Demo tag (e.g. v1.5.0-demo)'
        required: false
        default: 'v1.5.0-demo'

permissions:
  contents: write

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Automated Game Tests
        run: |
          python test_game.py
          python tests/test_demo_edition.py
          python tests/test_audio_system.py

  build:
    name: Build demo (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            artifact_name: Samurai-Edge-Demake-Demo-macOS.zip
          - os: ubuntu-latest
            platform: linux
            artifact_name: Samurai-Edge-Demake-Demo-Linux.tar.gz
          - os: windows-latest
            platform: windows
            artifact_name: Samurai-Edge-Demake-Demo-Windows.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Mark the build as demo
        shell: python
        run: |
          import pathlib
          p = pathlib.Path("src/edition.py")
          s = p.read_text(encoding="utf-8")
          assert "IS_DEMO = False" in s
          p.write_text(s.replace("IS_DEMO = False", "IS_DEMO = True", 1), encoding="utf-8")

      - name: Build with PyInstaller
        run: pyinstaller --clean -y samurai_edge.spec

      - name: Package Release (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/SamuraiEdge.app/Contents/Resources/assets
          mkdir -p dist/SamuraiEdge.app/Contents/MacOS/assets
          cp -R assets/* dist/SamuraiEdge.app/Contents/Resources/assets/
          cp -R assets/* dist/SamuraiEdge.app/Contents/MacOS/assets/
          xattr -cr dist/SamuraiEdge.app || true
          codesign -s - --force --deep dist/SamuraiEdge.app || true
          ditto -c -k --keepParent dist/SamuraiEdge.app ${{ matrix.artifact_name }}

      - name: Package Release (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/SamuraiEdge/assets
          cp -R assets/* dist/SamuraiEdge/assets/
          if [ -d "dist/SamuraiEdge/_internal" ]; then
            mkdir -p dist/SamuraiEdge/_internal/assets
            cp -R assets/* dist/SamuraiEdge/_internal/assets/
          fi
          tar -czvf ${{ matrix.artifact_name }} -C dist SamuraiEdge

      - name: Package Release (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path "dist\SamuraiEdge\assets"
          Copy-Item -Recurse -Force assets\* dist\SamuraiEdge\assets\
          if (Test-Path "dist\SamuraiEdge\_internal") {
            New-Item -ItemType Directory -Force -Path "dist\SamuraiEdge\_internal\assets"
            Copy-Item -Recurse -Force assets\* dist\SamuraiEdge\_internal\assets\
          }
          Compress-Archive -Path dist\SamuraiEdge -DestinationPath ${{ matrix.artifact_name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-demo-build
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  publish:
    name: Publish demo to itch.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Determine Tag Name
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Setup Butler
        uses: remarkablegames/setup-butler@v1

      - name: Deploy demo to itch.io via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          TARGET="colletes/samurai-edge-bakumatsu"
          butler push release_assets/Samurai-Edge-Demake-Demo-Windows.zip "$TARGET:windows-demo" --userversion "$TAG"
          butler push release_assets/Samurai-Edge-Demake-Demo-macOS.zip "$TARGET:osx-demo" --userversion "$TAG"
          butler push release_assets/Samurai-Edge-Demake-Demo-Linux.tar.gz "$TARGET:linux-demo" --userversion "$TAG"
