name: Deploy v1.4.0 to itch.io

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-itch:
    name: Upload v1.4.0 to itch.io via Butler
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Butler
        uses: remarkablegames/setup-butler@v1

      - name: Check itch.io Account & Games
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          echo "=== Profile / Key Check ==="
          curl -s -H "Authorization: $BUTLER_API_KEY" https://itch.io/api/1/key/my-games > games.json
          cat games.json | jq . || cat games.json
