<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#363d44"/>
      <stop offset="100%" stop-color="#14181c"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00e064" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Base circular -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#4a5568" stroke-width="2"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#252b33" stroke-width="1.5"/>
  <!-- Triângulo / Triangle Verde -->
  <polygon points="32,18 45,43 19,43" fill="none" stroke="#00e064" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
